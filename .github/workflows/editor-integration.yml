# SPDX-License-Identifier: AGPL-3.0-or-later
name: Validate editor integration
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      editor_commit:
        description: 'Optional: full editor8 commit SHA; empty checks current main'
        required: false
        type: string
      data_commit:
        description: 'Optional: full ontology commit SHA; empty checks the event commit'
        required: false
        type: string
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editor
    env:
      EDITOR8_DATA_ROOT: ${{ github.workspace }}/data
    steps:
      - name: Validate optional immutable revisions
        working-directory: ${{ github.workspace }}
        env:
          EDITOR_COMMIT: ${{ inputs.editor_commit }}
          DATA_COMMIT: ${{ inputs.data_commit }}
        run: |
          for revision in "$EDITOR_COMMIT" "$DATA_COMMIT"; do
            if [ -n "$revision" ] && ! [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'Manual revisions must be complete 40-character commit hashes' >&2
              exit 1
            fi
          done
      - name: Check out the private data revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_commit || github.sha }}
          path: data
          persist-credentials: false
      - name: Check out the public editor separately
        uses: actions/checkout@v4
        with:
          repository: ontologie8/editor8
          ref: ${{ inputs.editor_commit || 'main' }}
          path: editor
          persist-credentials: false
      - name: Record the exact tested pair
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo '## Editor and data integration'
            echo "- Editor: ontologie8/editor8 @ $(git -C editor rev-parse HEAD)"
            echo "- Data: notariat8/ontology @ $(git -C data rev-parse HEAD)"
            echo '- Separate checkouts; GitHub operations use an in-memory test substitute.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Python data integration
        run: python -m unittest discover -s tests/integration -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Browser data integration
        run: npm run test:integration:browser
      - name: Record outcome
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          RESULT: ${{ job.status }}
        run: echo "- Integration result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
