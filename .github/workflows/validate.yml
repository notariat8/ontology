name: Validate ontology
on:
  push:
  pull_request:
jobs:
  turtle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_cases.py
      - run: python scripts/render_case_docs.py --check
      - run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check editor/app.js
  editor-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nac-ontology-editor:ci .
