name: Validate ontology
on:
  push:
  pull_request:
jobs:
  turtle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_cases.py
      - run: python scripts/render_case_docs.py --check
      - run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check editor/app.js
  editor-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nac-ontology-editor:ci .
      - name: Start editor and verify public and protected endpoints
        run: |
          docker run --rm -d --name nac-editor-smoke -p 127.0.0.1:18765:8080 \
            -e GITHUB_APP_CLIENT_ID=smoke-test \
            -e GITHUB_APP_CLIENT_SECRET=smoke-test \
            -e GITHUB_REPOSITORY=notariat8/ontology \
            -e PUBLIC_ORIGIN=https://editor.example.org \
            -e EDITOR_USERS=smoke-tester nac-ontology-editor:ci
          trap 'docker logs nac-editor-smoke; docker stop nac-editor-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18765/healthz | grep -q '"status": "ok"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/healthz | grep -q '"status": "ok"'
          curl --fail --silent http://127.0.0.1:18765/ | grep -q 'NaC'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/status)" = 401
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
